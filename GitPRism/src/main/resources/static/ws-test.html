<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>포트폴리오 실시간 편집 테스트</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        textarea { width: 100%; height: 100px; font-size: 16px; }
        #log { margin-top: 20px; background: #f9f9f9; padding: 10px; border: 1px solid #ccc; height: 200px; overflow-y: auto; }
        #sendBtn { margin-top: 10px; padding: 8px 16px; font-size: 16px; }
        #activeUsers { color: #1a0dab; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>포트폴리오 실시간 편집 테스트</h2>

<label>포트폴리오 ID: <input type="number" id="portfolioId" value="3"></label><br><br>
<label>에디터 ID: <input type="number" id="editorId" value="1"></label><br><br>

<textarea id="content" placeholder="내용 입력 후 전송 버튼을 클릭하세요."></textarea><br>
<button id="sendBtn">전송</button>

<div id="activeUsers">👥 현재 접속 중: (초기화 대기)</div>
<div id="log"></div>

<script>
    let stompClient = null;
    let connected = false;
    let typingTimeout;

    // 전송 버튼 클릭 시 최초 connect 및 구독
    document.getElementById("sendBtn").addEventListener("click", () => {
        const portfolioId = document.getElementById("portfolioId").value;
        const editorId = document.getElementById("editorId").value;
        const editorName = `에디터 ${editorId}`;

        if (!connected) {
            const socket = new SockJS("http://localhost:8080/ws/edit");
            stompClient = Stomp.over(socket);

            stompClient.connect(
                {
                    portfolioId: portfolioId,
                    editorName: editorName
                },
                () => {
                    connected = true;
                    log("✅ WebSocket 연결됨");

                    // 구독들
                    stompClient.subscribe(`/topic/portfolio.${portfolioId}`, (msg) => {
                        const data = JSON.parse(msg.body);
                        log(`📩 수신: ${data.editorId} - ${data.content}`);
                    });

                    stompClient.subscribe(`/topic/typing.${portfolioId}`, (msg) => {
                        const data = JSON.parse(msg.body);
                        showTypingIndicator(data.editorName || `👤 ${data.editorId}`);
                    });

                    stompClient.subscribe(`/topic/active.${portfolioId}`, (msg) => {
                        const data = JSON.parse(msg.body);
                        showActiveUsers(data.activeEditors || []);
                    });

                    // 연결 완료 후 메시지 전송
                    sendEditMessage(portfolioId, editorId);
                }
            );
        } else {
            sendEditMessage(portfolioId, editorId);
        }
    });

    // 입력 감지 시 typing 메시지 전송
    document.getElementById("content").addEventListener("input", () => {
        if (!stompClient || !connected) return;

        const portfolioId = document.getElementById("portfolioId").value;
        const editorId = document.getElementById("editorId").value;
        const editorName = `에디터 ${editorId}`;

        stompClient.send("/app/typing", {}, JSON.stringify({
            portfolioId: parseInt(portfolioId),
            editorId: parseInt(editorId),
            editorName,
            typing: true,
            timestamp: Date.now()
        }));
    });

    function sendEditMessage(portfolioId, editorId) {
        const content = document.getElementById("content").value;

        stompClient.send("/app/edit", {}, JSON.stringify({
            portfolioId: parseInt(portfolioId),
            editorId: parseInt(editorId),
            content,
            timestamp: Date.now()
        }));

        log(`📤 전송: ${content}`);
    }

    function log(msg) {
        const logBox = document.getElementById("log");
        logBox.innerHTML += `<div>${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    function showTypingIndicator(editorName) {
        const logBox = document.getElementById("log");
        const indicatorId = "typing-indicator";

        const old = document.getElementById(indicatorId);
        if (old) old.remove();

        const indicator = document.createElement("div");
        indicator.id = indicatorId;
        indicator.innerText = `✏️ ${editorName}님이 입력 중입니다...`;
        indicator.style.color = "gray";
        logBox.appendChild(indicator);

        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            const cur = document.getElementById(indicatorId);
            if (cur) cur.remove();
        }, 2000);
    }

    function showActiveUsers(userList) {
        const el = document.getElementById("activeUsers");
        if (userList.length === 0) {
            el.innerText = "👥 현재 접속 중: 없음";
        } else {
            el.innerText = "👥 현재 접속 중: " + userList.join(", ");
        }
    }
</script>

</body>
</html>
